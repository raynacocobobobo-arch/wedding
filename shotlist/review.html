<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>恩万婚礼 · 全量候选图审阅</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#24372e;font:15px/1.5 system-ui,-apple-system,sans-serif}header{background:#24372e;color:#fff;padding:24px 18px}header>div,main{max-width:1400px;margin:auto}header h1{font-size:25px;margin:4px 0}header small{color:#cbd6cc}main{padding:16px}button,input,select,.file{font:inherit;color:inherit;background:white;border:1px solid #cbd2c9;border-radius:7px;padding:8px 12px}button,.file{cursor:pointer}button:disabled{opacity:.5}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0}.panel,.card{background:white;border:1px solid #d9ddd4;border-radius:12px;padding:14px;margin:12px 0}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:5px}.head h3{margin:0;font-size:17px}.muted,.count{color:#647168;font-size:13px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin:12px 0}.item{background:#f5f5f1;border:1px solid #ddd;border-radius:7px;overflow:hidden;min-width:0}.item img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#e8e8e4;cursor:zoom-in}.item p{padding:0 8px;margin:5px 0;font-size:12px;overflow-wrap:anywhere}.desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.row{padding:6px}.row button{font-size:12px;padding:4px 7px}.deleted{opacity:.5}dialog{border:0;border-radius:12px;max-width:96vw;max-height:94vh;padding:12px;color:inherit}dialog::backdrop{background:#000b}dialog img{display:block;max-width:90vw;max-height:75vh;object-fit:contain;margin:auto}a{color:inherit}@media(max-width:600px){main{padding:10px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><div><small>ENWAN WEDDING / FIELD GUIDE V5.0</small><h1>全量候选图审阅</h1><div>102 张动作卡 · 不限数量 · 人工删选</div></div></header><main><a href="./index.html">返回拍摄手册</a><div class="panel"><div id="summary">首次选择全量审图包 ZIP，图片会自动归入对应动作卡。</div><div class="controls"><label class="file">导入全量审图包<input id="pack" type="file" accept=".zip,application/zip" hidden></label><button id="export" disabled>导出删选结果</button><button id="restore" disabled>恢复全部删除</button></div><p id="status" class="muted" role="status"></p><p class="muted">原稿照片用于动作、机位、构图和调度借鉴，静帧不证明运镜。删除只影响当前动作卡引用，不会删除原图；删选记录可导出。</p></div><div id="filters" hidden><div class="controls"><select id="category" aria-label="动作分类"></select><input id="search" type="search" placeholder="搜索动作卡/编号"><label><input id="showDeleted" type="checkbox">显示已删</label></div></div><div id="cards"></div></main><dialog id="light"><div class="head"><span id="lightTitle"></span><button id="close">关闭</button></div><img id="large" alt="参考图"><p id="lightNote"></p></dialog><script>
'use strict';(()=>{const $=id=>document.getElementById(id),KEY='enwan-full-review-v1';let m=null,z=null,urls=[],largeURL=null,removed={},limits={},generation=0;try{removed=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{};const el=(t,c,s)=>{let e=document.createElement(t);if(c)e.className=c;if(s!==undefined)e.textContent=s;return e};const btn=(s,f)=>{let b=el('button','',s);b.onclick=f;return b};const status=s=>$('status').textContent=s;function save(){try{localStorage.setItem(KEY,JSON.stringify(removed))}catch{status('删选记录无法保存，请导出 JSON')}}const gone=(c,i)=>Array.isArray(removed[c])&&removed[c].includes(i);function toggle(c,i){let s=new Set(removed[c]||[]);s.has(i)?s.delete(i):s.add(i);removed[c]=[...s];save()}
async function openZip(file){let t=new DataView(await file.slice(Math.max(0,file.size-65557)).arrayBuffer()),e=-1;for(let i=t.byteLength-22;i>=0;i--)if(t.getUint32(i,true)===0x06054b50){e=i;break}if(e<0)throw Error('无效 ZIP');let n=t.getUint16(e+10,true),size=t.getUint32(e+12,true),off=t.getUint32(e+16,true);if(off+size>file.size||n>10000)throw Error('ZIP 目录不合法');let v=new DataView(await file.slice(off,off+size).arrayBuffer()),entries=new Map(),i=0,d=new TextDecoder();for(let k=0;k<n;k++){if(i+46>v.byteLength||v.getUint32(i,true)!==0x02014b50)throw Error('ZIP 目录损坏');let method=v.getUint16(i+10,true),len=v.getUint32(i+20,true),a=v.getUint16(i+28,true),b=v.getUint16(i+30,true),c=v.getUint16(i+32,true),o=v.getUint32(i+42,true);if(i+46+a+b+c>v.byteLength||o+30>file.size)throw Error('ZIP 目录越界');let p=d.decode(new Uint8Array(v.buffer,i+46,a));if(!p.includes('..')&&!p.startsWith('/')&&!entries.has(p))entries.set(p,{o,len,method});i+=46+a+b+c}return{entries,async get(p){let x=entries.get(p);if(!x)throw Error('缺失 '+p);let h=new DataView(await file.slice(x.o,x.o+30).arrayBuffer());if(h.getUint32(0,true)!==0x04034b50)throw Error('ZIP 头损坏');let start=x.o+30+h.getUint16(26,true)+h.getUint16(28,true);if(start+x.len>file.size)throw Error('ZIP 数据越界');let b=file.slice(start,start+x.len);if(x.method===8){b=await new Response(b.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob()}else if(x.method!==0)throw Error('不支持的 ZIP 压缩方式');return b}}}
function validate(a,b){if(a?.format!=='enwan-review-v1'||!Array.isArray(a.cards)||a.cards.length!==102||!a.images||Object.keys(a.images).length!==1482)throw Error('审图包清单不匹配');let ids=new Set();for(let c of a.cards){if(!/^C\d{2}-\d{2}$/.test(c.id)||ids.has(c.id)||!Array.isArray(c.images)||c.images.some(i=>!a.images[i]))throw Error('动作卡清单无效');ids.add(c.id)}for(let [id,r] of Object.entries(a.images)){if(!/^[WR]\d+$/.test(id)||r.id!==id||!/^assets\/references\/word\/[0-9a-f]{64}\.(jpeg|jpg|png)$/.test(r.path)||!/^assets\/references\/word-thumbs\/[0-9a-f]{64}\.jpg$/.test(r.thumb)||!b.entries.has(r.thumb)||(!a.previewOnly&&!b.entries.has(r.path)))throw Error('图片清单不完整：'+id)}return a}
function db(){return new Promise((res,rej)=>{let r=indexedDB.open('enwan-review-pack',1);r.onupgradeneeded=()=>r.result.createObjectStore('store');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function cache(f){let d=await db();try{await new Promise((res,rej)=>{let t=d.transaction('store','readwrite');t.objectStore('store').put(f,'zip');t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}finally{d.close()}}async function cached(){let d=await db();try{return await new Promise((res,rej)=>{let r=d.transaction('store').objectStore('store').get('zip');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}finally{d.close()}}
async function imageURL(r,thumb){let p=thumb||m.previewOnly?r.thumb:r.path,b=await z.get(p);return URL.createObjectURL(new Blob([b],{type:p.endsWith('.png')?'image/png':'image/jpeg'}))}function stats(){let count=m.cards.reduce((s,c)=>s+c.images.length,0),left=m.cards.reduce((s,c)=>s+c.images.filter(i=>!gone(c.id,i)).length,0),matched=Object.values(m.images).filter(i=>i.cards.length).length;$('summary').textContent='原图 '+m.total+' 张 · 已归类 '+matched+' 张 · '+m.cards.length+' 张动作卡 · 候选引用 '+left+' / '+count+'（已删 '+(count-left)+'）'+(m.previewOnly?' · 审图预览版':' · 原图版')}
async function light(id){let r=m.images[id];if(largeURL)URL.revokeObjectURL(largeURL);largeURL=null;$('lightTitle').textContent=id+' · '+r.source;$('lightNote').textContent=(r.group?r.group+' · ':'')+r.note;$('large').removeAttribute('src');if(!$('light').open)$('light').showModal();try{let u=await imageURL(r,false);if(!$('light').open){URL.revokeObjectURL(u);return}largeURL=u;$('large').src=u}catch(e){$('lightNote').textContent+=' · 读取失败：'+e.message}}$('close').onclick=()=>$('light').close();$('light').onclose=()=>{if(largeURL)URL.revokeObjectURL(largeURL);largeURL=null;$('large').removeAttribute('src')};
function render(){if(!m)return;let g=++generation;for(let u of urls)URL.revokeObjectURL(u);urls=[];$('cards').replaceChildren();let cat=$('category').value,q=$('search').value.trim().toLowerCase(),show=$('showDeleted').checked;let cs=cat==='未归类原图'||cat==='全部原图'?[{id:cat,title:cat,images:Object.keys(m.images).filter(i=>cat==='全部原图'||!m.images[i].cards.length)}]:m.cards.filter(c=>(cat==='全部动作卡'||cat===c.category)&&(!q||(c.id+' '+c.title+' '+c.category).toLowerCase().includes(q)));for(let c of cs){let ids=c.images.filter(i=>show||!gone(c.id,i)),limit=limits[c.id]||24,a=el('section','card'),h=el('div','head'),count=el('span','count',ids.length+' / '+c.images.length+' 张');h.append(el('h3','',c.id.startsWith('C')?c.id+' · '+c.title:c.title),count);a.append(h);if(!ids.length)a.append(el('p','muted','暂无候选'));let gallery=el('div','gallery');for(let id of ids.slice(0,limit)){let r=m.images[id],item=el('article','item'+(gone(c.id,id)?' deleted':'')),im=el('img');im.alt=id+' '+r.note;im.loading='lazy';im.onclick=()=>light(id);item.append(im);imageURL(r,true).then(u=>{if(g!==generation){URL.revokeObjectURL(u);return}urls.push(u);im.src=u}).catch(()=>im.alt='读取失败 '+id);let row=el('div','row');row.append(el('b','',id));if(c.id.startsWith('C')){let b=btn(gone(c.id,id)?'恢复':'删除',()=>{toggle(c.id,id);if(!show&&gone(c.id,id))item.remove();else{item.classList.toggle('deleted',gone(c.id,id));b.textContent=gone(c.id,id)?'恢复':'删除'}count.textContent=c.images.filter(i=>show||!gone(c.id,i)).length+' / '+c.images.length+' 张';stats()});row.append(b)}let note=el('p','desc',r.note);note.title=r.note;item.append(row,el('p','muted',r.group||r.source),note);gallery.append(item)}a.append(gallery);if(ids.length>limit)a.append(btn('继续显示 '+Math.min(48,ids.length-limit)+' 张（还有 '+(ids.length-limit)+'）',()=>{limits[c.id]=limit+48;let y=a.getBoundingClientRect().top+scrollY;render();scrollTo(0,y)}));$('cards').append(a)}stats()}
for(let id of ['category','search','showDeleted'])$(id).addEventListener('input',()=>{limits={};render()});$('restore').onclick=()=>{if(confirm('恢复全部已删除候选引用？')){removed={};save();render()}};$('export').onclick=()=>{let result={format:'enwan-review-selection-v1',sourceCount:m.total,excluded:removed,cards:m.cards.map(c=>({id:c.id,images:c.images.filter(i=>!gone(c.id,i)).map(i=>m.images[i].path)}))};let u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),a=el('a');a.href=u;a.download='enwan-review-selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
async function importPack(f,persist){status('读取审图包…');let b=await openZip(f),a=JSON.parse(await(await b.get('manifest.json')).text());m=validate(a,b);z=b;let cats=['全部动作卡',...new Set(m.cards.map(c=>c.category)),'未归类原图','全部原图'];$('category').replaceChildren(...cats.map(c=>{let o=el('option','',c);o.value=c;return o}));$('category').value=cats[1];$('filters').hidden=false;$('export').disabled=false;$('restore').disabled=false;limits={};render();status('已加载全部候选，可逐张删除。');if(persist)try{await cache(f);status('审图包已保存在当前浏览器，刷新可继续。')}catch{status('审图包已加载；本机未能持久保存，刷新后可能需要重新导入。')}}
$('pack').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{await importPack(f,true)}catch(err){status('导入失败：'+err.message)}finally{e.target.value=''}};cached().then(f=>{if(f)importPack(f,false).catch(e=>status('已缓存审图包读取失败：'+e.message))}).catch(()=>{})})();</script></body></html>
