name: Validate shotlist
on:
  push:
    paths:
      - 'shotlist/**'
      - '.github/workflows/shotlist-check.yml'
  pull_request:
    paths:
      - 'shotlist/**'
      - '.github/workflows/shotlist-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node shotlist/check-data.cjs
      - run: node --check shotlist/app.js
      - run: node --check shotlist/sw.js
