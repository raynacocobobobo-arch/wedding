name: Restore Word source reference images
on:
  push:
    branches: [main]
    paths:
      - 'shotlist/restore_word.py'
      - 'shotlist/word-source/transfer-request.json'
      - '.github/workflows/shotlist-restore-word.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shotlist-word-restore
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python shotlist/restore_word.py
      - run: |
          node shotlist/check-data.cjs
          node --check shotlist/app.js
          node --check shotlist/sw.js
      - name: Commit original images, thumbnails and source index
        run: |
          git add -- shotlist/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m "Restore verified Word originals and source cards"
            git push origin HEAD:main
          fi
